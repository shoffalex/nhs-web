# Rate-limit zone for the admin login. Must live in the http context, which is
# why it is a separate file from the server block:
#
#   sudo cp deploy/nginx/nhs-ratelimit.conf /etc/nginx/conf.d/nhs-ratelimit.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# 5 requests/minute per IP, with a burst of 5. A person typing a password wrong
# twice never notices; a script trying the dictionary gets 503s.

limit_req_zone $binary_remote_addr zone=nhs_login:10m rate=5r/m;
