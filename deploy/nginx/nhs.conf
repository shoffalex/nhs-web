# nginx site config for the NHS chapter site.
#
#   sudo cp deploy/nginx/nhs.conf /etc/nginx/sites-available/nhs
#   sudo ln -s /etc/nginx/sites-available/nhs /etc/nginx/sites-enabled/nhs
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Static files are served straight from the git checkout, so a deploy is just
# `git pull` — no copy step that can go stale. The API is proxied on the same
# origin, which is why the browser never needs CORS in production.

upstream nhs_api {
    server 127.0.0.1:8000;
}

server {
    listen 80;
    listen [::]:80;

    # Replace with your domain once DNS points here; the IP works meanwhile.
    server_name 68.183.109.62;

    root /srv/nhs-web/site;
    index index.html;

    access_log /var/log/nginx/nhs.access.log;
    error_log  /var/log/nginx/nhs.error.log;

    # Don't hand out the admin page to crawlers.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 2m;

    # ------------------------------------------------------------------ API
    location /api/ {
        proxy_pass http://nhs_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;

        # If uvicorn is down, the API 502s but every static page still loads.
        proxy_intercept_errors off;
    }

    # Brute-force protection for the one endpoint that checks a password.
    # The limit_req_zone lives in deploy/nginx/nhs-ratelimit.conf (http context).
    location = /api/auth/login {
        limit_req zone=nhs_login burst=5 nodelay;

        proxy_pass http://nhs_api;
        proxy_http_version 1.1;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # -------------------------------------------------------------- statics
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location /documents/ {
        # Member PDFs. Nothing here is secret from nginx's point of view — if
        # these need to be members-only, put auth_basic on this block.
        try_files $uri =404;
    }

    # Pretty URLs: /calendar serves calendar.html
    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}
